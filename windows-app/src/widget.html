<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kairos — sticky note</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body class="sticky">
    <div id="error-bar" hidden></div>
    <header class="sticky-head" data-tauri-drag-region>
      <span class="label" data-tauri-drag-region>TODAY</span>
      <span id="counts" class="counts" data-tauri-drag-region></span>
      <span class="spacer" data-tauri-drag-region></span>
      <button id="pin" type="button" title="Pin above other windows" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z" /><path d="M12 15v5" />
        </svg>
      </button>
      <button id="open" type="button" title="Open the main window">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 16L18 6" /><path d="M9 6h9v9" />
        </svg>
      </button>
      <button id="close" type="button" title="Hide the sticky note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12" /><path d="M18 6L6 18" />
        </svg>
      </button>
    </header>
    <ul id="list" class="sticky-list"></ul>
    <div class="sticky-foot">W hides · drag the header to move</div>
    <script type="module" src="widget.js"></script>
  </body>
</html>
