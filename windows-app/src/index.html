<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="error-bar" hidden></div>

    <!-- The rail is the whole navigation: four pages and the sticky note. -->
    <nav class="rail" aria-label="Pages">
      <button id="page-agenda" class="active" type="button" aria-label="Tasks (1)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h10" />
        </svg>
        <span class="key">1</span>
      </button>
      <button id="page-calendar" type="button" aria-label="Calendar (2)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="20" height="18" rx="2" /><path d="M3 10h18" />
          <path d="M8 3v4" /><path d="M16 3v4" />
        </svg>
        <span class="key">2</span>
      </button>
      <button id="page-habits" type="button" aria-label="Habits (3)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="20" height="18" rx="2" /><path d="M9 4v16" />
          <path d="M3 12h18" />
        </svg>
        <span class="key">3</span>
      </button>
      <button id="page-workout" type="button" aria-label="Workout (4)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6" /><path d="M20 9v6" /><path d="M7 6v12" /><path d="M17 6v12" />
          <path d="M7 12h10" />
        </svg>
        <span class="key">4</span>
      </button>

      <div class="spacer"></div>

      <button id="page-settings" type="button" aria-label="Settings (5)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h9M16 6h5M3 12h13M20 12h1M3 18h5M12 18h9" />
          <path d="M14 4v4M18 10v4M10 16v4" />
        </svg>
        <span class="key">5</span>
      </button>

      <button id="sticky-toggle" type="button" aria-label="Toggle the sticky note (W)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h14v10l-5 6H5z" /><path d="M19 14h-5v6" />
        </svg>
        <span class="key">W</span>
      </button>
    </nav>

    <div class="column">
      <!-- One mono line: where you are, and what you can press. -->
      <div class="status">
        <span id="here" class="here">Tasks</span>
        <span id="count"></span>
        <div class="spacer"></div>
        <div id="status-tools"></div>
      </div>

      <!-- Tasks: lists on the left, the grouped list beside them. -->
      <div id="agenda-page" class="page">
        <div class="split">
          <nav id="lists" class="lists" aria-label="Lists"></nav>
          <div class="split-main">
            <ul id="agenda" class="list" tabindex="0" aria-label="Tasks"></ul>
            <p id="empty" class="empty" hidden></p>
          </div>
        </div>
      </div>

      <!-- Calendar -->
      <div id="calendar-page" class="page" hidden>
        <div id="cal-dow" class="cal-dow"></div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>

      <!-- Habits: the grid, then the month's journal and its summary. -->
      <div id="habits-page" class="page" hidden>
        <div id="habit-rows" class="habit-rows"></div>
        <div class="section-rule">
          <span class="rule"></span>
          <span>JOURNAL</span>
          <span class="rule"></span>
        </div>
        <div class="habit-lower">
          <div id="journal" class="journal"></div>
          <aside id="summary" class="summary" aria-label="This month"></aside>
        </div>
      </div>

      <!-- Workout: routines on the left, the session grid beside them. -->
      <div id="workout-page" class="page" hidden>
        <div class="split">
          <nav id="routines" class="lists" aria-label="Routines"></nav>
          <div class="split-main">
            <div id="workout-grid" class="workout-grid"></div>
            <p id="workout-empty" class="empty" hidden></p>
          </div>
        </div>
      </div>

      <!-- Settings: rendered from what the core says the switches are. -->
      <div id="settings-page" class="page" hidden>
        <div id="settings" class="settings"></div>
      </div>

      <!-- Capture lives at the bottom and is always there, never a modal. -->
      <div id="preview" class="preview" aria-live="polite"></div>
      <div id="capture" class="capture">
        <span class="prompt">›</span>
        <div class="capture-field">
          <div id="highlight" class="highlight-layer" aria-hidden="true"></div>
          <input
            id="quick-add"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="gym every day 5pm @health #fitness !p1"
            aria-label="Add a task in one line"
          />
        </div>
        <span id="capture-hint" class="hint">J K move · X done · U undo · Y redo</span>
      </div>
    </div>

    <aside id="detail" class="detail" hidden aria-label="Task detail"></aside>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
